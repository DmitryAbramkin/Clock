name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Forks and pull requests do not receive repository secrets. In that case
      # AGP generates a throwaway debug key, which is fine for a CI-only APK.
      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi

      - name: Verify signing key
        run: |
          set -euo pipefail
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "No signing secret for this build; AGP will generate a throwaway debug key."
            exit 0
          fi
          EXPECTED_SHA256="f7da07bec4bfc61af8931f05b2e594b0c225648ffadfe8e01660c9eff9a4f722"
          ACTUAL_SHA256=$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey \
            | awk -F': ' '/SHA256:/ {print $2; exit}' \
            | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "Keystore certificate SHA-256: $ACTUAL_SHA256"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 does not contain the expected signing key"
            exit 1
          fi

      - name: Test, lint and build
        run: |
          # AGP resolves the debug keystore through ANDROID_PREFS_ROOT (and
          # ANDROID_SDK_HOME); pin both to $HOME so the restored file is used.
          export ANDROID_SDK_HOME="$HOME"
          export ANDROID_PREFS_ROOT="$HOME"
          ./gradlew testDebugUnitTest lintDebug assembleRelease --console=plain

      - name: Read version
        id: version
        run: |
          echo "name=$(sed -n 's/^versionName=//p' version.txt)" >> "$GITHUB_OUTPUT"
          echo "code=$(sed -n 's/^versionCode=//p' version.txt)" >> "$GITHUB_OUTPUT"

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$AAPT" dump badging "$APK" | grep -q \
            "versionCode='${{ steps.version.outputs.code }}' versionName='${{ steps.version.outputs.name }}'"
          "$APKSIGNER" verify "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Clock-v${{ steps.version.outputs.name }}-${{ github.sha }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
