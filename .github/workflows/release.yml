name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v3.12.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Verify version
        id: version
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/^versionName=//p' version.txt)
          VERSION_CODE=$(sed -n 's/^versionCode=//p' version.txt)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::version.txt is missing versionName or versionCode"
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v$VERSION_NAME" ]; then
            echo "::error::Tag $RELEASE_TAG does not match versionName $VERSION_NAME"
            exit 1
          fi
          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}" >/dev/null
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease --console=plain

      - name: Prepare release assets
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          VERSION_NAME="${{ steps.version.outputs.name }}"
          # The app has no native libraries, so a single universal APK covers
          # every device. ABI splits would only duplicate the same file.
          mkdir -p dist
          cp "$APK" "dist/Clock-v${VERSION_NAME}-universal.apk"
          cp "$APK" "dist/Clock.apk"
          cd dist
          sha256sum "Clock-v${VERSION_NAME}-universal.apk" > "Clock-v${VERSION_NAME}-universal.apk.sha256"
          sha256sum Clock.apk > Clock.apk.sha256
          sha256sum Clock-v*-universal.apk Clock.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify APK
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          APK="dist/Clock-v${{ steps.version.outputs.name }}-universal.apk"
          "$AAPT" dump badging "$APK" | grep -q \
            "versionCode='${{ steps.version.outputs.code }}' versionName='${{ steps.version.outputs.name }}'"
          "$APKSIGNER" verify --print-certs "$APK"
          CERT_SHA256=$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          EXPECTED_SHA256="f7da07bec4bfc61af8931f05b2e594b0c225648ffadfe8e01660c9eff9a4f722"
          if [ "$CERT_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Unexpected signing certificate: $CERT_SHA256"
            exit 1
          fi

      - name: Extract release notes
        run: |
          set -euo pipefail
          VERSION_NAME="${{ steps.version.outputs.name }}"
          awk -v version="$VERSION_NAME" '
            index($0, "## " version) == 1 { in_section=1; next }
            in_section && /^## / { exit }
            in_section { print }
          ' changelog.md | sed '/./,$!d' > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::No changelog section found for $VERSION_NAME"
            exit 1
          fi
          {
            echo
            echo "---"
            echo
            echo "**versionCode:** ${{ steps.version.outputs.code }}  "
            echo "**APK:** \`Clock-v${VERSION_NAME}-universal.apk\`  "
            echo "**Стабильная ссылка:** [Clock.apk](https://github.com/${{ github.repository }}/releases/latest/download/Clock.apk)  "
            echo "**SHA-256:** \`Clock-v${VERSION_NAME}-universal.apk.sha256\`, \`Clock.apk.sha256\` или \`SHA256SUMS.txt\`"
          } >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION_NAME="${{ steps.version.outputs.name }}"
          FILES=(
            "dist/Clock-v${VERSION_NAME}-universal.apk"
            "dist/Clock-v${VERSION_NAME}-universal.apk.sha256"
            "dist/Clock.apk"
            "dist/Clock.apk.sha256"
            "dist/SHA256SUMS.txt"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${FILES[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Clock v${VERSION_NAME}" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" "${FILES[@]}" \
              --title "Clock v${VERSION_NAME}" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag \
              --latest
          fi
