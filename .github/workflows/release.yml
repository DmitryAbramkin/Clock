name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v3.12.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
      checkout_ref: ${{ steps.decide.outputs.checkout_ref }}
      checkout_sha: ${{ steps.decide.outputs.checkout_sha }}
      version_name: ${{ steps.decide.outputs.version_name }}
      version_code: ${{ steps.decide.outputs.version_code }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}

      - name: Decide whether to release
        id: decide
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          VERSION_NAME=$(sed -n 's/^versionName=//p' version.txt)
          VERSION_CODE=$(sed -n 's/^versionCode=//p' version.txt)
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::version.txt is missing versionName or versionCode"
            exit 1
          fi
          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::versionName must use x.y.z format, got: $VERSION_NAME"
            exit 1
          fi

          CHECKOUT_SHA=$(git rev-parse HEAD)
          CHECKOUT_REF="$CHECKOUT_SHA"
          TAG="v$VERSION_NAME"
          RELEASE=true

          case "$GITHUB_EVENT_NAME" in
            push)
              if [[ "$GITHUB_REF" == refs/tags/* ]]; then
                TAG="$GITHUB_REF_NAME"
                CHECKOUT_REF="refs/tags/$TAG"
                if [ "$TAG" != "v$VERSION_NAME" ]; then
                  echo "::error::Tag $TAG does not match versionName $VERSION_NAME"
                  exit 1
                fi
              else
                LATEST_TAG=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null || true)
                if [ -z "$LATEST_TAG" ]; then
                  echo "No published release yet; $VERSION_NAME ($VERSION_CODE) will be published."
                else
                  if ! git rev-parse --verify --quiet "refs/tags/$LATEST_TAG^{commit}" >/dev/null; then
                    echo "::error::Latest release tag $LATEST_TAG is not present in the checkout"
                    exit 1
                  fi
                  LATEST_NAME=$(git show "$LATEST_TAG:version.txt" | sed -n 's/^versionName=//p')
                  LATEST_CODE=$(git show "$LATEST_TAG:version.txt" | sed -n 's/^versionCode=//p')
                  if [ -z "$LATEST_NAME" ] || [ -z "$LATEST_CODE" ]; then
                    echo "::error::Cannot read version.txt from $LATEST_TAG"
                    exit 1
                  fi
                  echo "Latest release: $LATEST_NAME ($LATEST_CODE) at $LATEST_TAG"
                  echo "Current version: $VERSION_NAME ($VERSION_CODE)"
                  if [ "$VERSION_NAME" = "$LATEST_NAME" ] && [ "$VERSION_CODE" = "$LATEST_CODE" ]; then
                    echo "Version is unchanged; skipping the release build."
                    RELEASE=false
                  elif [ "$VERSION_NAME" = "$LATEST_NAME" ]; then
                    echo "::error::versionCode changed from $LATEST_CODE to $VERSION_CODE but versionName $VERSION_NAME is unchanged. Bump versionName so the release has a new tag."
                    exit 1
                  elif [ "$(printf '%s\n%s\n' "$LATEST_NAME" "$VERSION_NAME" | sort -V | tail -n1)" != "$VERSION_NAME" ]; then
                    echo "::error::versionName $VERSION_NAME is older than the latest release $LATEST_NAME"
                    exit 1
                  elif [ "$VERSION_CODE" -le "$LATEST_CODE" ]; then
                    echo "::error::versionCode $VERSION_CODE must be greater than $LATEST_CODE from $LATEST_TAG"
                    exit 1
                  fi
                fi
              fi
              ;;
            workflow_dispatch)
              TAG="$INPUT_TAG"
              CHECKOUT_REF="refs/tags/$TAG"
              if ! git rev-parse --verify --quiet "refs/tags/$TAG^{commit}" >/dev/null; then
                echo "::error::Tag $TAG does not exist"
                exit 1
              fi
              if [ "$TAG" != "v$VERSION_NAME" ]; then
                echo "::error::Tag $TAG does not match versionName $VERSION_NAME"
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported event: $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac

          if [ "$RELEASE" = "true" ]; then
            for file in changelog.md changelog.ru.md; do
              if ! grep -q "^## $VERSION_NAME " "$file"; then
                echo "::error::$file has no '## $VERSION_NAME' section"
                exit 1
              fi
            done
          fi

          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"
          echo "checkout_sha=$CHECKOUT_SHA" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
      VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
      CHECKOUT_SHA: ${{ needs.prepare.outputs.checkout_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Verify checkout
        run: |
          set -euo pipefail
          ACTUAL_SHA=$(git rev-parse HEAD)
          echo "Checked out $ACTUAL_SHA"
          if [ "$ACTUAL_SHA" != "$CHECKOUT_SHA" ]; then
            echo "::error::Checked out $ACTUAL_SHA, expected $CHECKOUT_SHA"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Verify signing key
        run: |
          set -euo pipefail
          EXPECTED_SHA256="f7da07bec4bfc61af8931f05b2e594b0c225648ffadfe8e01660c9eff9a4f722"
          ACTUAL_SHA256=$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey \
            | awk -F': ' '/SHA256:/ {print $2; exit}' \
            | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "Keystore certificate SHA-256: $ACTUAL_SHA256"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_BASE64 does not contain the expected signing key"
            exit 1
          fi

      - name: Verify version
        run: |
          set -euo pipefail
          ACTUAL_NAME=$(sed -n 's/^versionName=//p' version.txt)
          ACTUAL_CODE=$(sed -n 's/^versionCode=//p' version.txt)
          if [ "$ACTUAL_NAME" != "$VERSION_NAME" ] || [ "$ACTUAL_CODE" != "$VERSION_CODE" ]; then
            echo "::error::version.txt changed after the prepare job"
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v$VERSION_NAME" ]; then
            echo "::error::Tag $RELEASE_TAG does not match versionName $VERSION_NAME"
            exit 1
          fi

      - name: Test, lint and build
        run: |
          # AGP resolves the debug keystore through ANDROID_PREFS_ROOT (and
          # ANDROID_SDK_HOME); pin both to $HOME so the restored file is used.
          export ANDROID_SDK_HOME="$HOME"
          export ANDROID_PREFS_ROOT="$HOME"
          ./gradlew testDebugUnitTest lintDebug assembleRelease --console=plain

      - name: Prepare release assets
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          # The app has no native libraries, so a single APK covers every
          # device. One stable asset name keeps old and new download links valid.
          mkdir -p dist
          cp "$APK" dist/Clock.apk
          cd dist
          sha256sum Clock.apk > Clock.apk.sha256
          sha256sum Clock.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify APK
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          APK="dist/Clock.apk"
          "$AAPT" dump badging "$APK" | grep -q \
            "versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'"
          "$APKSIGNER" verify --print-certs "$APK"
          CERT_SHA256=$("$APKSIGNER" verify --print-certs "$APK" \
            | awk -F': ' '/certificate SHA-256 digest:/ {print $NF; exit}')
          EXPECTED_SHA256="f7da07bec4bfc61af8931f05b2e594b0c225648ffadfe8e01660c9eff9a4f722"
          echo "APK certificate SHA-256: $CERT_SHA256"
          if [ "$CERT_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Unexpected signing certificate: $CERT_SHA256"
            exit 1
          fi

      - name: Extract release notes
        run: |
          set -euo pipefail
          extract_section() {
            awk -v version="$VERSION_NAME" '
              index($0, "## " version) == 1 { in_section=1; next }
              in_section && /^## / { exit }
              in_section { print }
            ' "$1" | sed '/./,$!d'
          }
          NOTES_EN=$(extract_section changelog.md)
          NOTES_RU=$(extract_section changelog.ru.md)
          if [ -z "$NOTES_EN" ] || [ -z "$NOTES_RU" ]; then
            echo "::error::No changelog section for $VERSION_NAME in changelog.md or changelog.ru.md"
            exit 1
          fi
          {
            echo "## English"
            echo
            echo "$NOTES_EN"
            echo
            echo "---"
            echo
            echo "## Русский"
            echo
            echo "$NOTES_RU"
            echo
            echo "---"
            echo
            echo "**versionCode:** $VERSION_CODE  "
            echo "**APK:** \`Clock.apk\`  "
            echo "**Stable link / Стабильная ссылка:** [Clock.apk](https://github.com/${{ github.repository }}/releases/latest/download/Clock.apk)  "
            echo "**SHA-256:** \`Clock.apk.sha256\` или \`SHA256SUMS.txt\`"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          FILES=(
            "dist/Clock.apk"
            "dist/Clock.apk.sha256"
            "dist/SHA256SUMS.txt"
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${FILES[@]}" --clobber
            gh release edit "$RELEASE_TAG" \
              --title "Clock v${VERSION_NAME}" \
              --notes-file RELEASE_NOTES.md
          elif git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" >/dev/null; then
            TAG_SHA=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            if [ "$TAG_SHA" != "$CHECKOUT_SHA" ]; then
              echo "::error::Tag $RELEASE_TAG points to $TAG_SHA, not $CHECKOUT_SHA"
              exit 1
            fi
            gh release create "$RELEASE_TAG" "${FILES[@]}" \
              --title "Clock v${VERSION_NAME}" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag \
              --latest
          else
            gh release create "$RELEASE_TAG" "${FILES[@]}" \
              --title "Clock v${VERSION_NAME}" \
              --notes-file RELEASE_NOTES.md \
              --target "$CHECKOUT_SHA" \
              --latest
          fi
